[package]
name = "web"
description = "MLSChat browser client: the MLS library compiled to WebAssembly"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mls = { path = "../mls" }
wire = { path = "../wire" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }
